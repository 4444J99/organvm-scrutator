name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run full test suite
        run: pytest -q
      - name: Lint bounded repair
        run: ruff check src/organvm_scrutator/ci_guard.py tests/test_ci_guard.py
      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          import yaml
          for path in ('.github/workflows/daily-scan.yml', '.github/workflows/test.yml'):
              with open(path, encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          PY
      - name: Compile package sources
        run: python -m compileall -q src
