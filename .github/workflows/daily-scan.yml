name: Daily Scan

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      total_plans: ${{ steps.check_plans.outputs.total_plans }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -e .
      
      - name: Run scan
        run: |
          organvm-scrutator scan
          organvm-scrutator stats

      - name: Check total plans
        id: check_plans
        run: |
          if [ -f data/indices/visibility-index.json ]; then
            TOTAL=$(jq -r '.total_plans // 0' data/indices/visibility-index.json)
            echo "total_plans=$TOTAL" >> $GITHUB_OUTPUT
          else
            echo "total_plans=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Check for gaps
        if: steps.check_plans.outputs.total_plans != '0'
        run: organvm-scrutator gaps
      
      - name: Commit changes
        if: steps.check_plans.outputs.total_plans != '0'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: daily scrutator scan"
          file_pattern: "data/**"

  dispatch:
    needs: scan
    if: needs.scan.outputs.total_plans != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -e .
      
      - name: Dispatch research inquiries
        run: organvm-scrutator dispatch --threshold 3
      
      - name: Commit inquiries
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: dispatch research inquiries"
          file_pattern: "data/**"
