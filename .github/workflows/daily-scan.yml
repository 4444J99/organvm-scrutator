name: Daily Scan

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      total_plans: ${{ steps.check_plans.outputs.total_plans }}
      publish_scan: ${{ steps.check_plans.outputs.publish_scan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -e .
      
      - name: Run scan
        run: |
          organvm-scrutator scan
          organvm-scrutator stats

      - name: Check total plans
        id: check_plans
        run: python -m organvm_scrutator.ci_guard data/indices/visibility-index.json >> "$GITHUB_OUTPUT"
      
      - name: Check for gaps
        if: steps.check_plans.outputs.publish_scan == 'true'
        run: organvm-scrutator gaps
      
      - name: Commit changes
        if: steps.check_plans.outputs.publish_scan == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: daily scrutator scan"
          file_pattern: "data/**"

  dispatch:
    needs: scan
    if: needs.scan.outputs.publish_scan == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -e .
      
      - name: Dispatch research inquiries
        run: organvm-scrutator dispatch --threshold 3
      
      - name: Commit inquiries
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: dispatch research inquiries"
          file_pattern: "data/**"
